services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: repo-be-v2:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DB_URL: ${DB_URL:-jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-repo}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
      DB_USERNAME: ${DB_USERNAME:-${MYSQL_USER:-repo}}
      DB_PASSWORD: ${DB_PASSWORD:-${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env}}
      DDL_AUTO: ${DDL_AUTO:-update}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      MONGO_URI: ${MONGO_URI:-mongodb://${MONGO_USERNAME:-repo}:${MONGO_PASSWORD:?MONGO_PASSWORD must be set in .env}@mongo:27017/${MONGO_DATABASE:-repo}?authSource=admin}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION:-3600000}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION:-1209600000}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:?AWS_S3_BUCKET must be set in .env}
      AWS_S3_PREFIX: ${AWS_S3_PREFIX:-dsm_repo}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}

      # Datadog APM. 트레이스를 datadog 컨테이너로 보낸다.
      DD_AGENT_HOST: datadog
      DD_TRACE_ENABLED: ${DD_TRACE_ENABLED:-true}
      DD_SERVICE: ${DD_SERVICE:-repo-be}
      DD_ENV: ${DD_ENV:-prod}
      DD_VERSION: ${DD_VERSION:-0.0.1}
      # 로그 한 줄마다 trace_id를 심어 트레이스와 로그를 오갈 수 있게 한다.
      DD_LOGS_INJECTION: "true"
      # 로그를 JSON 한 줄로 찍는다. Datadog이 필드를 알아서 갈라 읽는다.
      # Boot 4 기본 기능이라 의존성을 더 넣을 필요가 없다.
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ${LOG_FORMAT:-logstash}
    labels:
      com.datadoghq.tags.service: ${DD_SERVICE:-repo-be}
      com.datadoghq.tags.env: ${DD_ENV:-prod}
      com.datadoghq.tags.version: ${DD_VERSION:-0.0.1}
      com.datadoghq.ad.logs: '[{"source": "java", "service": "repo-be"}]'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - backend

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    # 호스트 안에서만 연다. DB 도구는 SSH 터널로 붙는다.
    # 127.0.0.1을 빼면 공인 IP로 그대로 열리니 주의한다.
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-repo}
      MYSQL_USER: ${MYSQL_USER:-repo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}
      TZ: Asia/Seoul
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root --password=\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  mongo:
    image: mongo:8.0
    restart: unless-stopped
    # 호스트 안에서만 연다. DB 도구는 SSH 터널로 붙는다.
    # 127.0.0.1을 빼면 공인 IP로 그대로 열리니 주의한다.
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-repo}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD must be set in .env}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-repo}
      TZ: Asia/Seoul
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

  # 모니터링 에이전트.
  # 호스트 메트릭, 컨테이너 메트릭, 컨테이너 로그, 앱 트레이스를 한꺼번에 보낸다.
  # 외부로 여는 포트는 없다. 같은 네트워크 안에서만 받는다.
  datadog:
    image: gcr.io/datadoghq/agent:7
    container_name: datadog-agent
    restart: unless-stopped
    pid: host
    environment:
      DD_API_KEY: ${DD_API_KEY:?DD_API_KEY must be set in .env}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_ENV: ${DD_ENV:-prod}
      DD_TAGS: project:repo

      # 트레이스 수신. 다른 컨테이너에서 오는 것도 받으려면 non_local_traffic이 필요하다.
      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"

      # 모든 컨테이너의 stdout을 로그로 수집한다. 에이전트 자신은 뺀다.
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
      DD_CONTAINER_EXCLUDE: name:datadog-agent

      # 프로세스 단위 CPU·메모리를 호스트 기준으로 본다.
      DD_PROCESS_AGENT_ENABLED: "true"

      # conf.d의 DB 점검이 쓰는 비밀번호. 아래 DB들에 datadog 전용 계정을 먼저 만들어야 한다.
      DD_MYSQL_PASSWORD: ${DD_MYSQL_PASSWORD:?DD_MYSQL_PASSWORD must be set in .env}
      DD_MONGO_PASSWORD: ${DD_MONGO_PASSWORD:?DD_MONGO_PASSWORD must be set in .env}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./datadog/conf.d:/conf.d:ro
      - datadog-run:/opt/datadog-agent/run
    networks:
      - backend

volumes:
  mysql-data:
  redis-data:
  mongo-data:
  # 어디까지 읽었는지 기록해둔다. 에이전트를 재시작해도 로그가 겹치지 않는다.
  datadog-run:

networks:
  backend:
    driver: bridge
